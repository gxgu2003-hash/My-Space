name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # 💡 注意：如果你的主分支叫 master，请把 main 改成 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # 自动寻找并上传打包后的 dist 目录，不再读取根目录的 main.tsx

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
